<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Last Base</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #061318;
      --panel: rgba(11, 31, 39, .9);
      --panel-soft: rgba(14, 42, 50, .72);
      --ink: #eefaf8;
      --muted: #9fc6c1;
      --line: rgba(49, 216, 200, .28);
      --blue: #31d8c8;
      --green: #7ed957;
      --yellow: #f4b63d;
      --red: #ef5d75;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 16% 18%, rgba(49, 216, 200, .20), transparent 28%),
        radial-gradient(circle at 86% 12%, rgba(244, 182, 61, .14), transparent 24%),
        linear-gradient(90deg, rgba(49, 216, 200, .06) 1px, transparent 1px) 0 0 / 34px 34px,
        linear-gradient(rgba(126, 217, 87, .05) 1px, transparent 1px) 0 0 / 34px 34px,
        var(--bg);
      font-family: ui-rounded, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }
    main {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 38px 0;
    }
    .deck {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 340px;
      gap: 18px;
      align-items: stretch;
    }
    .panel,
    .visual {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 22px 60px rgba(0, 0, 0, .28);
    }
    .panel {
      padding: 30px;
    }
    .mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 58px;
      height: 58px;
      margin-bottom: 18px;
      border-radius: 8px;
      background: var(--blue);
      color: #041114;
      font-size: 30px;
    }
    h1 {
      margin: 0;
      font-size: 62px;
      line-height: 1;
      letter-spacing: 0;
    }
    .category {
      margin: 12px 0 0;
      color: var(--green);
      font-weight: 800;
    }
    p {
      max-width: 660px;
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.8;
    }
    .launcher {
      display: grid;
      gap: 10px;
      margin-top: 28px;
    }
    label {
      color: var(--yellow);
      font-size: 13px;
      font-weight: 800;
    }
    .launcher-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 92px 112px;
      gap: 10px;
    }
    input,
    button {
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font: inherit;
    }
    input {
      min-width: 0;
      padding: 0 14px;
      color: var(--ink);
      background: rgba(2, 12, 16, .78);
    }
    button {
      cursor: pointer;
      color: #041114;
      background: var(--blue);
      font-weight: 900;
    }
    button.secondary {
      color: var(--ink);
      background: rgba(49, 216, 200, .12);
    }
    .message {
      min-height: 24px;
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }
    .steps {
      display: grid;
      gap: 10px;
      margin-top: 20px;
    }
    .step {
      padding: 14px 16px;
      border: 1px solid rgba(159, 198, 193, .18);
      border-radius: 8px;
      background: var(--panel-soft);
      color: var(--muted);
      line-height: 1.6;
    }
    code {
      display: block;
      margin-top: 8px;
      padding: 12px 14px;
      border: 1px solid rgba(49, 216, 200, .2);
      border-radius: 8px;
      background: #101828;
      color: #f5f8ff;
      font-size: 14px;
      overflow-x: auto;
    }
    .visual {
      position: relative;
      min-height: 520px;
      overflow: hidden;
      background:
        radial-gradient(circle at center, rgba(49, 216, 200, .12), transparent 36%),
        rgba(6, 19, 24, .92);
    }
    .orbit {
      position: absolute;
      inset: 58px 34px;
      border: 1px solid rgba(49, 216, 200, .26);
      border-radius: 50%;
      animation: turn 14s linear infinite;
    }
    .orbit::before,
    .orbit::after {
      position: absolute;
      content: "";
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--yellow);
    }
    .orbit::before { top: 20px; left: 64px; }
    .orbit::after { right: 32px; bottom: 72px; background: var(--red); }
    .crew {
      position: absolute;
      left: 142px;
      top: 180px;
      width: 58px;
      height: 82px;
      border-radius: 26px 26px 20px 20px;
      background: var(--blue);
      box-shadow: inset -12px -14px 0 rgba(0, 0, 0, .16);
      animation: bob 2.6s ease-in-out infinite;
    }
    .crew::before {
      position: absolute;
      right: -8px;
      top: 20px;
      width: 34px;
      height: 22px;
      content: "";
      border-radius: 12px;
      background: linear-gradient(135deg, #d9fffb, #438fb0);
    }
    .chips {
      position: absolute;
      left: 24px;
      right: 24px;
      bottom: 24px;
      display: grid;
      gap: 10px;
    }
    .chip {
      padding: 12px 14px;
      border: 1px solid rgba(159, 198, 193, .18);
      border-radius: 8px;
      background: rgba(2, 12, 16, .7);
      color: var(--muted);
      font-weight: 800;
    }
    a {
      display: inline-flex;
      margin-top: 24px;
      color: var(--blue);
      font-weight: 800;
      text-decoration: none;
    }
    @keyframes turn {
      to { transform: rotate(360deg); }
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    @media (max-width: 820px) {
      .deck { grid-template-columns: 1fr; }
      h1 { font-size: 46px; }
      .launcher-row { grid-template-columns: 1fr; }
      .visual { min-height: 360px; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 1ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <main>
    <div class="deck">
      <section class="panel">
        <div class="mark">🏰</div>
        <h1>Last Base</h1>
        <div class="category">动作原型</div>
        <p>原创基地防守网页游戏，包含基地建设、敌人图鉴和升级策略。这是前后端联机工程：先启动本机程序，再用下面的网址进入游戏。</p>
        <form class="launcher" id="launcher-form">
          <label for="game-url">游戏网址</label>
          <div class="launcher-row">
            <input id="game-url" type="url" value="http://127.0.0.1:5173">
            <button type="submit">打开</button>
            <button class="secondary" id="check-button" type="button">检测</button>
          </div>
          <p class="message" id="message">如果页面打不开，先双击启动器。</p>
        </form>
        <div class="steps">
          <div class="step">1. 双击启动器
            <code>/Users/xjc/Developer/games/启动 Space Hideout.command</code>
          </div>
          <div class="step">2. 或者手动启动
            <code>cd /Users/xjc/Developer/games/projects/13-Last Base</code>
            <code>pnpm dev</code>
          </div>
        </div>
        <a href="../">返回作品集</a>
      </section>
      <aside class="visual" aria-label="游戏预览">
        <div class="orbit"></div>
        <div class="crew"></div>
        <div class="chips">
          <div class="chip">外观：颜色、帽子、面罩预览</div>
          <div class="chip">AI：BOT 船员和猎手决策地基</div>
          <div class="chip">动画：巡逻、扫描、启动反馈</div>
        </div>
      </aside>
    </div>
  </main>
  <script>
    const form = document.querySelector("#launcher-form");
    const input = document.querySelector("#game-url");
    const message = document.querySelector("#message");
    const checkButton = document.querySelector("#check-button");

    function currentUrl() {
      try {
        return new URL(input.value.trim()).toString();
      } catch {
        message.textContent = "网址格式不对，可以试试 http://127.0.0.1:5173";
        return null;
      }
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const url = currentUrl();
      if (!url) return;
      window.open(url, "_blank", "noopener,noreferrer");
      message.textContent = "已尝试打开游戏网址。";
    });

    checkButton.addEventListener("click", async () => {
      const url = currentUrl();
      if (!url) return;
      message.textContent = "正在检测本机游戏服务...";
      try {
        await fetch(url, { mode: "no-cors", cache: "no-store" });
        message.textContent = "检测到游戏服务，可以点击打开。";
      } catch {
        message.textContent = "还没有检测到游戏服务，请先双击启动器。";
      }
    });
  </script>
</body>
</html>
