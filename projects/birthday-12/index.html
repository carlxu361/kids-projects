<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,interactive-widget=resizes-content">
  <meta name="theme-color" content="#071116">
  <title>橙子 12 岁生日隐藏关卡</title>
  <link rel="stylesheet" href="/birthday/style.css">
  <link rel="modulepreload" href="/birthday/stage-3d.js">
  <link rel="modulepreload" href="/birthday/three-0.160.0.min.js">
  <script defer src="/birthday/arcade.js"></script>
  <script defer src="/birthday/effects.js"></script>
  <script defer src="/birthday/wishes.js"></script>
  <script defer src="/birthday/blow-detector.js"></script>
  <script defer src="/birthday/cake-geometry.js"></script>
  <script defer src="/birthday/party-cake.js"></script>
  <script defer src="/08-Brainiac%20Maniac%20%C2%B7%20Boss%20%E9%92%A2%E7%90%B4%E8%AE%AD%E7%BB%83%E8%90%A5/studio.js"></script>
  <script defer src="/08-Brainiac%20Maniac%20%C2%B7%20Boss%20%E9%92%A2%E7%90%B4%E8%AE%AD%E7%BB%83%E8%90%A5/repertoire.js"></script>
  <script defer src="/birthday/app.js"></script>
  <script defer src="/birthday/blessings.js"></script>
</head>
<body>
  <canvas id="world-3d" aria-hidden="true" hidden></canvas>
  <canvas id="sky" aria-hidden="true"></canvas>
  <button id="page-fullscreen" type="button" aria-label="全屏" aria-pressed="false" hidden>
    <span aria-hidden="true"></span>
  </button>
  <header class="hud">
    <a href="/">橙子的作品集</a>
    <span class="mono">BIRTHDAY · LV.12</span>
    <div class="row hud-controls">
      <button id="fireworks" class="effect-toggle" type="button" aria-label="烟花" title="烟花" aria-pressed="true"><span aria-hidden="true">✷</span></button>
      <button id="music" class="effect-toggle" type="button" aria-label="背景音乐" title="背景音乐" aria-pressed="false"><span aria-hidden="true">♫</span></button>
      <span id="balance" class="balance" aria-live="polite">星核 0</span>
    </div>
  </header>
  <main id="mission">
    <div class="journey-top" id="journey-top" hidden><span id="guide-look" aria-hidden="true">🍊</span><span id="scene-progress"></span></div>
    <nav id="chapters" aria-label="关卡" hidden></nav>
    <section id="stage" tabindex="-1"></section>
    <p id="loading" role="status">正在读取存档…</p>
  </main>
  <footer class="hud"><span>橙子的生日存档</span><button type="button" data-open-blessings>送上祝福</button><button id="systems" aria-haspopup="dialog">版本与致谢</button></footer>
  <dialog id="scene-guide" class="scene-guide" aria-labelledby="scene-title" aria-describedby="scene-narration">
    <div class="scene-card">
      <div class="scene-avatar" id="scene-avatar" aria-hidden="true">🍊</div>
      <h2 id="scene-title"></h2>
      <p id="scene-narration"></p>
      <button id="scene-continue" class="primary" type="button"><span class="guide-btn-label"></span><span class="guide-btn-progress" aria-hidden="true"></span></button>
      <p id="scene-auto-hint" class="scene-auto-hint">3 秒后自动进入 · 点击立即跳过</p>
    </div>
  </dialog>
  <dialog id="panel" class="credits-panel" aria-labelledby="panel-title">
    <div class="panel-top">
      <h2 id="panel-title">版本与致谢</h2>
      <form method="dialog"><button autofocus>关闭</button></form>
    </div>
    <div id="credits" tabindex="0" role="region" aria-label="片尾字幕"></div>
    <div class="row credits-controls">
      <button id="credits-toggle" type="button">暂停字幕</button>
      <button id="credits-replay" type="button">从头播放</button>
    </div>
  </dialog>
  <dialog id="blessings" class="credits-panel blessings-panel" aria-labelledby="blessings-title">
    <div class="panel-top">
      <h2 id="blessings-title">送上生日祝福</h2>
      <form method="dialog"><button autofocus>关闭</button></form>
    </div>
    <form id="blessings-form">
      <label for="blessings-name">昵称</label>
      <input id="blessings-name" name="name" maxlength="24" required>
      <label for="blessings-message">给橙子的话</label>
      <textarea id="blessings-message" name="message" maxlength="240" rows="4" required></textarea>
      <p>家长审核后公开，请勿填写联系方式。</p>
      <button class="primary">提交祝福</button>
    </form>
    <p id="blessings-status" role="status"></p>
    <h3>大家的祝福</h3>
    <p id="blessings-empty" hidden>还没有公开的祝福。</p>
    <ul id="blessings-list"></ul>
    <details id="blessings-moderator">
      <summary>家长审核</summary>
      <form id="blessings-login">
        <label for="blessings-key">审核口令</label>
        <input id="blessings-key" name="code" type="password" autocomplete="off" required>
        <button>开启审核</button>
      </form>
    </details>
    <section id="blessings-review" hidden>
      <h3>待审核祝福</h3>
      <p>目前没有待审核的祝福。</p>
      <ul></ul>
    </section>
  </dialog>
  <template id="intro">
    <section class="hero premiere">
      <div class="hero-copy">
        <p class="mono signal"><span class="live-dot"></span> 11.28 · 生日特别场</p>
        <h1>橙子，<br><span>12 岁生日快乐<span class="bang">！</span></span></h1>
        <p class="lead">第 20 个作品，送给做出前 19 个的你。</p>
        <div class="row premiere-actions">
          <button class="primary" id="start">点亮生日派对</button>
          <button id="skip-intro">直接开始旅程</button>
        </div>
        <p id="briefing" aria-live="polite" hidden></p>
      </div>
      <div class="premiere-caption" aria-hidden="true"><span>ORANGE ARCADE</span><strong>LV.12</strong></div>
    </section>
  </template>
</body>
</html>
